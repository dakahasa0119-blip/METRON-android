name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔥 ZIP を展開
    - name: Unzip project
      run: unzip Proxyhand-Android.zip -d Proxyhand-Android

    # 🔥 Gradle Wrapper を自動生成（ここが最重要）
    - name: Generate Gradle Wrapper
      run: |
        cd Proxyhand-Android
        gradle wrapper --gradle-version 8.2

    - name: Grant execute permission for gradlew
      run: chmod +x Proxyhand-Android/gradlew

    - name: Build APK
      run: |
        cd Proxyhand-Android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: Proxyhand-Android/app/build/outputs/apk/debug/app-debug.apk
