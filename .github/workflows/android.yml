name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 🔥 解凍先をカレントディレクトリに固定
    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    # 🔥 階層を確認し、Wrapperを生成（ディレクトリ名の揺れを許容）
    - name: Generate Gradle Wrapper
      run: |
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    # 🔥 ビルド実行
    - name: Build APK
      run: |
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        ./gradlew assembleDebug

    # 🔥 APKを回収（ワイルドカードで階層ズレを吸収）
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
