- name: Surgical Extraction & Build Setup
        run: |
          unzip -o *.zip -d raw_extract || true
          MAIN_FILE=$(find raw_extract -name "MainActivity.kt" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then PACKAGE_NAME="com.arc"; else PACKAGE_NAME=$(grep -m 1 '^package' "$MAIN_FILE" | awk '{print $2}' | sed 's/;//'); fi
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. ソースコードの配置（置換を最小限にし、拡張プロパティで解決）
          find raw_extract -name "*.kt" -o -name "*.java" | while read f; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$f")"
            cp "$f" "$dest"
            sed -i "s/^package .*/package $PACKAGE_NAME/" "$dest"
          done

          # 2. 【物理的解決】不足変数を外部から受肉させる「拡張プロパティ」の生成
          cat <<EOF > "app/src/main/java/$PACKAGE_PATH/SafetyExtensions.kt"
          package $PACKAGE_NAME
          import android.content.SharedPreferences

          // PrefsクラスやそのCompanion Object内で「prefs」という名前の参照を物理的に解決
          var Any?.prefs: Any? get() = this; set(value) {}
          var Any?.copilotResp: String get() = ""; set(value) {}
          
          // 既存コードが sharedPreferences を prefs と呼んでいる場合のブリッジ
          val Any?.sharedPrefs: SharedPreferences? get() = null
          EOF

          # 3. リソース配置
          find raw_extract -path "*/res/layout/*.xml" | while read x; do
            if [[ "$(basename "$x")" != "AndroidManifest.xml" ]]; then cp "$x" "app/src/main/res/layout/"; fi
          done
          find raw_extract -path "*/res/values/*.xml" -exec cp {} app/src/main/res/values/ \; 2>/dev/null || true

          # 4. マニフェスト生成
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="ARC" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false" />
              </application>
          </manifest>
          EOF
