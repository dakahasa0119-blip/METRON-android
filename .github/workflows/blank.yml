name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Force Reconstruct Project
      run: |
        # ディレクトリの物理的再構築
        mkdir -p app/src/main/java/proxyhand/android
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        
        unzip -o Proxyhand-Android.zip -d raw_data
        
        # ソースコードとリソースを配置
        find raw_data -name "*.kt" -exec cp {} app/src/main/java/proxyhand/android/ \;
        find raw_data -name "AndroidManifest.xml" -exec cp {} app/src/main/ \;
        find raw_data -name "activity_main.xml" -exec cp {} app/src/main/res/layout/ \;
        find raw_data -name "strings.xml" -exec cp {} app/src/main/res/values/ \;

        # 🔥 【重要】正しい設定ファイルを直接生成（上書き）
        echo "include ':app'" > settings.gradle
        
        cat <<EOF > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0" }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat <<EOF > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'proxyhand.android'
            compileSdk 34
            defaultConfig { applicationId "proxyhand.android"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
            buildFeatures { viewBinding true }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.13.1'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
            implementation 'org.nanohttpd:nanohttpd:2.3.1'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        }
        EOF

        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "app/build/outputs/apk/debug/app-debug.apk"
