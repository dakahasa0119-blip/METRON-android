name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Unzip
        run: unzip -o *.zip -d .

      - name: Build and Class-Aware Alignment
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
        run: |
          # 1. 物理特定
          MANIFEST_ORIGIN=$(find $(pwd) -name "AndroidManifest.xml" | grep "/main/" | head -n 1)
          PROJECT_DIR_ORIGIN=$(echo "$MANIFEST_ORIGIN" | sed 's|/src/main/AndroidManifest.xml||')
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_ORIGIN" || echo "com.arc")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # 2. 構造の再構築
          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 3. ソースの物理移動
          find "$PROJECT_DIR_ORIGIN" -name "*.kt" -exec cp {} app/src/main/java/$PACKAGE_PATH/ \;
          find "$PROJECT_DIR_ORIGIN" -name "*.java" -exec cp {} app/src/main/java/$PACKAGE_PATH/ \;
          find "$PROJECT_DIR_ORIGIN" -name "*.xml" -path "*/layout/*" -exec cp {} app/src/main/res/layout/ \;
          
          # 4. メインActivityの動的特定（クラス名をソースから抽出）
          # Activityを継承しているファイル名を検索
          REAL_ACTIVITY=$(grep -rE "class .* : .*Activity|class .* extends .*Activity" app/src/main/java | head -n 1 | grep -oP "class \K\w+" || echo "MainActivity")
          echo "Detected Activity: $REAL_ACTIVITY"

          # 5. Manifestの動的生成（検出したクラス名を注入）
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="METRON" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".$REAL_ACTIVITY" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Prefs.kt パッケージ同期
          find app/src/main/java -name "Prefs.kt" -exec sed -i "1s/.*/package $PACKAGE_NAME/" {} +

          # 7. 設計図生成 (build.gradle)
          echo "rootProject.name = 'METRON-android'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'com.google.gms:google-services:4.4.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          apply plugin: 'com.google.gms.google-services'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { applicationId '$PACKAGE_NAME'; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-analytics'
          }
          EOF

          # 8. Firebase設定と実行
          echo "$FIREBASE_JSON" > "app/google-services.json"
          gradle wrapper
          ./gradlew assembleRelease --no-daemon

          # 9. 救出
          mkdir -p $GITHUB_WORKSPACE/temp_artifacts
          find . -name "*-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/app-release-unsigned.apk \;

      - name: Upload
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: temp_artifacts/app-release-unsigned.apk
