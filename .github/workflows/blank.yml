name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Unzip
        run: unzip -o *.zip -d .

      - name: Build and Total Overwrite V2
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
        run: |
          # 1. 物理特定（絶対パス）
          ROOT_FILE=$(find $(pwd) -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          PROJECT_ROOT=$(dirname "$ROOT_FILE")
          APP_GRADLE=$(find "$PROJECT_ROOT" -name "build.gradle" | grep "/app/" | head -n 1)
          APP_DIR=$(dirname "$APP_GRADLE")
          ROOT_GRADLE="$PROJECT_ROOT/build.gradle"

          # 2. リポジトリ管理の統一（settings.gradle）
          cat <<EOF > "$PROJECT_ROOT/settings.gradle"
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "METRON-android"
          include ':app'
          EOF

          # 3. ルートのbuild.gradleを浄化（空にするか、最小限のプラグイン定義のみ）
          # 二重定義エラーを避けるため、ここではリポジトリを書かない
          cat <<EOF > "$ROOT_GRADLE"
          buildscript {
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          EOF

          # 4. 魂の抽出
          MANIFEST=$(find "$PROJECT_ROOT" -name "AndroidManifest.xml" | grep "/main/" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST" || echo "com.arc.trial")

          # 5. 設計図（app/build.gradle）を上書き
          cat <<EOF > "$APP_GRADLE"
          apply plugin: 'com.android.application'
          apply plugin: 'com.google.gms.google-services'

          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig {
                  applicationId '$PACKAGE_NAME'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-analytics'
          }
          EOF

          # 6. Firebase設定と実行
          echo "$FIREBASE_JSON" > "${APP_DIR}/google-services.json"
          cd "$PROJECT_ROOT"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          # 7. 救出
          mkdir -p $GITHUB_WORKSPACE/temp_artifacts
          find "$PROJECT_ROOT" -name "*-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/app-release-unsigned.apk \;

      - name: Upload
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: temp_artifacts/app-release-unsigned.apk
