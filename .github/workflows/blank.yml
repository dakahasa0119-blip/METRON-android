name: Build and Deploy to Firebase (Construction Mode)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7 Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Unzip project
      # 艦長が入れ替えた最新のZIP名に物理整合
      run: unzip -o メトロン_SYNC_20260213.zip -d .

    - name: Build and Configure
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # プロジェクトルート特定
        GRADLE_ROOT=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
        cd "$GRADLE_ROOT"
        
        # Firebase設定（google-services.json）の物理注入
        APP_DIR=$(find . -name "app" -type d | head -n 1)
        echo "$FIREBASE_JSON" > "${APP_DIR}/google-services.json"

        # 艦長の指示通り「構築」するためにReleaseビルドを実行（Mappingファイルを生成）
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        
        # 成果物(APK)を固定パスへコピー
        mkdir -p $GITHUB_WORKSPACE/temp_artifacts
        find . -name "app-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/ \;

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        # 構築されたAPKを物理アップロード
        file: temp_artifacts/app-release-unsigned.apk
