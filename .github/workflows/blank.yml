name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Unzip
        run: unzip -o *.zip -d .

      - name: Build and Force Construction
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
        run: |
          # 1. 物理的浄化
          find . -path "*/src/main/res/layout/AndroidManifest.xml" -delete

          # 2. パス特定
          APP_GRADLE=$(find $(pwd) -name "build.gradle" | grep "/app/" | head -n 1)
          APP_DIR=$(dirname "$APP_GRADLE")
          ROOT_FILE=$(find $(pwd) -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          PROJECT_ROOT=$(dirname "$ROOT_FILE")

          # 3. 魂の抽出と精密注入
          MANIFEST=$(find "$PROJECT_ROOT" -name "AndroidManifest.xml" | grep "/main/" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST" || echo "com.arc.trial")
          
          sed -i '/namespace /d' "$APP_GRADLE"
          sed -i "/android {/a \    namespace '$PACKAGE_NAME'" "$APP_GRADLE"
          
          # 依存関係ブロックの徹底補強（Google Material等、現代のビルドに必須なものを一括注入）
          if ! grep -q "androidx.appcompat:appcompat" "$APP_GRADLE"; then
            sed -i "/dependencies {/a \    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.9.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" "$APP_GRADLE"
          fi

          # 4. Firebase設定
          echo "$FIREBASE_JSON" > "${APP_DIR}/google-services.json"

          # 5. 実行（詳細ログを強制出力）
          cd "$PROJECT_ROOT"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --info
          
          # 6. 救出
          mkdir -p $GITHUB_WORKSPACE/temp_artifacts
          find "$PROJECT_ROOT" -name "*-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/app-release-unsigned.apk \;

      - name: Upload
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: temp_artifacts/app-release-unsigned.apk
