name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # cache: gradle  <-- ❌ これを削除（解凍前に中身を探してエラーになるため）

    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    - name: Generate Gradle Wrapper
      run: |
        # ZIPの中身が Proxyhand-Android/ フォルダでラップされているか確認
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build APK
      run: |
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
