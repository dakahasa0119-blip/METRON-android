name: METRON_STABLE_REBORN

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Reconstruct for Absolute Identity
        run: |
          # 1. 物理配置の再構築（新住所：com.arc.metron）
          mkdir -p app/src/main/java/com/arc/metron
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 2. 全ソースの展開と内部パスの物理置換
          unzip -o *.zip -d raw_extract || true
          find raw_extract -name "*.kt" -o -name "*.java" -exec cp {} app/src/main/java/com/arc/metron/ \;
          
          # 内部のpackageとimportを新住所へ一括置換（起動停止の主要因を排除）
          find app/src/main/java/com/arc/metron -type f -exec sed -i "s/package com.arc/package com.arc.metron/g" {} +
          find app/src/main/java/com/arc/metron -type f -exec sed -i "s/import com.arc\./import com.arc.metron./g" {} +

          # 3. AndroidManifest.xml（特定済みのテーマ欠損を修正）
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:label="METRON_STABLE" 
                  android:icon="@android:mipmap/sym_def_app_icon"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name="com.arc.metron.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build New Package with Fixes
        run: |
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { 
              namespace 'com.arc.metron'
              compileSdk 34
              defaultConfig { 
                  applicationId "com.arc.metron" 
                  minSdk 24 
                  targetSdk 34 
                  versionCode 1
                  versionName "1.0-REBORN" 
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Artifact Delivery
        uses: actions/upload-artifact@v4
        with:
          name: metron-stable-reborn
          path: app/build/outputs/apk/debug/*.apk
