name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Unzip
        run: unzip -o *.zip -d .

      - name: Build and Structural Alignment
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
        run: |
          # 1. 物理特定（深層フォルダから情報を吸い出す）
          MANIFEST_ORIGIN=$(find $(pwd) -name "AndroidManifest.xml" | grep "/main/" | head -n 1)
          PROJECT_DIR_ORIGIN=$(echo "$MANIFEST_ORIGIN" | sed 's|/src/main/AndroidManifest.xml||')
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_ORIGIN" || echo "com.arc")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # 2. 新しい、完璧なプロジェクト構造をルートに強制作成
          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 3. ソースファイルを正規の場所へ強制移動
          find "$PROJECT_DIR_ORIGIN" -name "*.kt" -exec cp {} app/src/main/java/$PACKAGE_PATH/ \;
          find "$PROJECT_DIR_ORIGIN" -name "*.java" -exec cp {} app/src/main/java/$PACKAGE_PATH/ \;
          find "$PROJECT_DIR_ORIGIN" -name "*.xml" -path "*/layout/*" -exec cp {} app/src/main/res/layout/ \;
          cp "$MANIFEST_ORIGIN" app/src/main/AndroidManifest.xml

          # 4. Prefs.kt のパッケージ名を物理同期
          find app/src/main/java -name "Prefs.kt" -exec sed -i "1s/.*/package $PACKAGE_NAME/" {} +

          # 5. 設計図（build.gradle）の生成
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "METRON-android"
          include ':app'
          EOF

          cat <<EOF > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              id 'com.google.gms.google-services' version '4.4.0' apply false
          }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.google.gms.google-services' }
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { applicationId '$PACKAGE_NAME'; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-analytics'
          }
          EOF

          # 6. Firebase設定と実行
          echo "$FIREBASE_JSON" > "app/google-services.json"
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          # 7. 救出
          mkdir -p $GITHUB_WORKSPACE/temp_artifacts
          find . -name "*-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/app-release-unsigned.apk \;

      - name: Upload
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: temp_artifacts/app-release-unsigned.apk
