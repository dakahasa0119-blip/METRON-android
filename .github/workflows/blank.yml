name: Pure Build to APK (Conflict Resolution Model)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Surgical Extraction & Centralized Safety Buffer
        run: |
          unzip -o *.zip -d raw_extract
          MAIN_FILE=$(find raw_extract -name "MainActivity.kt" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package \K[\w.]+' "$MAIN_FILE")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ソースの配置（パッケージ名修正のみ）
          find raw_extract -name "*.kt" -o -name "*.java" | while read f; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$f")"
            cp "$f" "$dest"
            sed -i "1s/.*/package $PACKAGE_NAME/" "$dest"
          done

          # 【物理的解決】全ファイルへの注入をやめ、1つの「安全基地」ファイルを作成
          cat <<EOF > "app/src/main/java/$PACKAGE_PATH/SafetyBuffer.kt"
          package $PACKAGE_NAME
          import org.json.JSONObject

          // グローバル拡張プロパティ（1箇所のみで定義）
          val Any?.prefs: Any? get() = null
          val Any?.copilotResp: String get() = ""
          val Any?.instance: Any? get() = null
          val Any?.currentProfile: String get() = ""
          val Any?.allAiMode: Boolean get() = false
          val Any?.summaryPrompt: String get() = ""
          val Any?.hallucinationTolerance: Int get() = 0
          val Any?.allAiDelayMs: Long get() = 0
          val Any?.profileSlot1: String get() = ""
          val Any?.profileSlot2: String get() = ""
          val Any?.profileSlot3: String get() = ""

          // DataBinding の欠落を補完するダミー
          class ActivitySettingsBinding {
              companion object { 
                  @JvmStatic fun inflate(layoutInflater: Any?): ActivitySettingsBinding = ActivitySettingsBinding() 
                  @JvmStatic fun bind(view: Any?): ActivitySettingsBinding = ActivitySettingsBinding()
              }
              val root: Any? = null
          }
          EOF

          # リソースの配置
          find raw_extract -path "*/res/layout/*.xml" -not -name "AndroidManifest.xml" | while read x; do
            base=$(basename "$x" | tr '[:upper:]' '[:lower:]')
            cp "$x" "app/src/main/res/layout/$base"
          done
          find raw_extract -path "*/res/values/*.xml" -exec cp {} app/src/main/res/values/ \; 2>/dev/null || true

          # マニフェスト作成
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="METRON" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: Build System Finalizer
        run: |
          PACKAGE_NAME=$(grep -oP 'package \K[\w.]+' $(find app/src/main/java -name "MainActivity.kt"))
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              buildFeatures { viewBinding true }
              defaultConfig { applicationId namespace; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0-STABLE-ENV" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'com.squareup.okhttp3:okhttp:4.11.0'
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
          }
          EOF

      - name: Build with Target Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          arguments: assembleRelease --no-daemon

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: metron-resolved-apk
          path: app/build/outputs/apk/release/*.apk
        
