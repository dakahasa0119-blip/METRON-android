name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    # 🔥 最新の Gradle 9.x を避け、安定版 8.7 を強制インストールして Wrapper を作る
    - name: Generate Gradle Wrapper (Fixed Version)
      run: |
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        export PATH=$PWD/gradle-8.7/bin:$PATH
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Build APK
      run: |
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        # 念のためクリーンしてからビルド
        ./gradlew clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
