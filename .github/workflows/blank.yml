name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Unzip and Inject Firebase
      run: |
        unzip -o Proxyhand-Android.zip -d .
        # プロジェクトフォルダの特定
        ROOT_DIR=$(find . -maxdepth 2 -name "app" -type d -exec dirname {} \;)
        cd $ROOT_DIR
        
        # google-services.json の物理生成 (Secretsから)
        echo '${{ secrets.FIREBASE_SERVICES_JSON }}' > app/google-services.json

        # Firebase SDK の注入 (build.gradle の書き換え)
        sed -i "/dependencies {/a \        classpath 'com.google.gms:google-services:4.4.2'" build.gradle
        sed -i "/plugins {/a \    id 'com.google.gms.google-services'" app/build.gradle
        sed -i "/dependencies {/a \    implementation platform('com.google.firebase:firebase-bom:34.9.0')\n    implementation 'com.google.firebase:firebase-analytics-ktx'" app/build.gradle

    - name: Build with Gradle
      run: |
        ROOT_DIR=$(find . -maxdepth 2 -name "app" -type d -exec dirname {} \;)
        cd $ROOT_DIR
        gradle assembleDebug --no-daemon

    # 【重要】Firebase App Distribution への自動配信
    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }} # Firebaseの設定から取得
        token: ${{ secrets.FIREBASE_TOKEN }}   # firebase login:ci で取得
        groups: testers
        file: "**/app/build/outputs/apk/debug/app-debug.apk"
