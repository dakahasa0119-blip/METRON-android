name: METRON_STABLE_REBORN_FINAL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - name: Reconstruct Absolute Environment
        run: |
          # 1. 物理構造の全構築
          mkdir -p app/src/main/java/com/arc/metron
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 2. ソース展開と「完全」置換
          unzip -o *.zip -d raw_extract || true
          find raw_extract -name "*.kt" -o -name "*.java" -exec cp {} app/src/main/java/com/arc/metron/ \;
          
          # java/kotlinファイルの住所と参照を根こそぎ変える
          find app/src/main/java/com/arc/metron -type f -exec sed -i "s/package com.arc/package com.arc.metron/g" {} +
          find app/src/main/java/com/arc/metron -type f -exec sed -i "s/import com.arc\./import com.arc.metron./g" {} +
          find app/src/main/java/com/arc/metron -type f -exec sed -i "s/R\.layout\./com.arc.metron.R.layout./g" {} +

          # 3. 欠落している「テーマ」を物理生成
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Metron" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          # 4. AndroidManifest.xml (生成したテーマを明示)
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:label="METRON_STABLE" 
                  android:theme="@style/Theme.Metron">
                  <activity android:name="com.arc.metron.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build with Strong Dependencies
        run: |
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android { 
              namespace 'com.arc.metron'
              compileSdk 34
              defaultConfig { applicationId "com.arc.metron"; minSdk 24; targetSdk 34; versionCode 3; versionName "3.0" }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Delivery
        uses: actions/upload-artifact@v4
        with:
          name: metron-final-v3
          path: app/build/outputs/apk/debug/*.apk
