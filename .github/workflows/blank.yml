name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true # 物理障害回避のため継続
        dependency-graph: disabled

    - name: Unzip and Flatten
      run: |
        unzip -o Proxyhand-Android.zip -d .
        # 階層が二重になっている場合、中身をカレントに引き出す
        if [ -d "Proxyhand-Android/Proxyhand-Android" ]; then
          mv Proxyhand-Android/Proxyhand-Android/* .
        elif [ -d "Proxyhand-Android" ]; then
          mv Proxyhand-Android/* .
        fi

    - name: Build APK (Force)
      run: |
        # 確実に settings.gradle がある場所で実行
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
