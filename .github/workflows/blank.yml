name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7 Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true # インフラ不安定回避のため一時オフ

    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    - name: Inject Firebase and Build
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # プロジェクトディレクトリの特定
        ROOT_DIR=$(find . -maxdepth 2 -name "app" -type d -exec dirname {} \;)
        cd "$ROOT_DIR"
        
        # 秘密鍵（json）の物理配置
        echo "$FIREBASE_JSON" > app/google-services.json

        # システム直系の Gradle でビルド
        gradle assembleDebug --no-daemon

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        file: "**/app/build/outputs/apk/debug/app-debug.apk"
