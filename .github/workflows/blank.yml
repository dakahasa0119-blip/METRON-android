- name: Surgical Extraction & Build Setup
        run: |
          # 1. 抽出とディレクトリ作成
          unzip -o *.zip -d raw_extract || true
          
          # MainActivityからパッケージ名を取得
          MAIN_FILE=$(find raw_extract -name "MainActivity.kt" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then
            PACKAGE_NAME="com.arc"
          else
            PACKAGE_NAME=$(grep -m 1 '^package' "$MAIN_FILE" | awk '{print $2}' | sed 's/;//')
          fi
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 2. ソースコードの配置
          find raw_extract -name "*.kt" -o -name "*.java" | while read f; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$f")"
            cp "$f" "$dest"
            sed -i "s/^package .*/package $PACKAGE_NAME/" "$dest"
          done

          # 3. リソースファイルの配置（AndroidManifestを除外するよう物理強化）
          find raw_extract -path "*/res/layout/*.xml" | while read x; do
            fname=$(basename "$x")
            # AndroidManifest.xml は layout フォルダに入れない
            if [ "$fname" != "AndroidManifest.xml" ]; then
              cp "$x" "app/src/main/res/layout/"
            fi
          done
          find raw_extract -path "*/res/values/*.xml" -exec cp {} app/src/main/res/values/ \; 2>/dev/null || true

          # 4. マニフェストの生成（src/main/ 直下に正しく配置）
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application 
                  android:label="ARC" 
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false" />
              </application>
          </manifest>
          EOF
