name: Pure Build to APK (Physical Fix + Debug)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparation
        run: |
          unzip -o *.zip -d .
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Surgical Integration & Debug Injection
        run: |
          # 1. パッケージ名特定
          MANIFEST_ORIGIN=$(find $(pwd) -name "AndroidManifest.xml" | grep "/main/" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_ORIGIN" || echo "com.arc")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # 2. 構造再構築
          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 3. ソース移植と「超優先」デバッグ回路注入
          find . -name "*.kt" -o -name "*.java" | while read file; do
            if [[ "$file" != *"app/src/main/java"* ]]; then
              dest="app/src/main/java/$PACKAGE_PATH/$(basename "$file")"
              cp "$file" "$dest"
              sed -i "1s/.*/package $PACKAGE_NAME/" "$dest"
              sed -i "/import com.google.firebase/d" "$dest"
              sed -i "/FirebaseApp/d" "$dest"
              sed -i "/import .*\.R;/d" "$dest"
              
              # onCreateの直後（superの前）に、クラッシュを捕まえる網を張る
              if grep -q "onCreate" "$dest"; then
                sed -i '/super.onCreate/i \        Thread.setDefaultUncaughtExceptionHandler { _, e -> val tv = android.widget.TextView(this); tv.text = "--- METRON ERROR ---\\n" + e.stackTraceToString(); tv.setTextColor(android.graphics.Color.RED); tv.setBackgroundColor(android.graphics.Color.BLACK); tv.setTextSize(10f); runOnUiThread { setContentView(tv) } };' "$dest"
              fi
            fi
          done

          # 4. リソース救出
          find . -name "*.xml" -not -name "AndroidManifest.xml" -path "*/res/*" -exec cp {} app/src/main/res/layout/ \; 2>/dev/null || true
          
          # 5. 【修正】package属性を物理的に記述したManifest
          REAL_ACTIVITY=$(grep -rE "class .* : .*Activity|class .* extends .*Activity" app/src/main/java | head -n 1 | grep -oP "class \K\w+" || echo "MainActivity")
          
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <application android:label="METRON" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".$REAL_ACTIVITY" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHer" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Final Build
        run: |
          # 前回の失敗を踏まえ、変数を直接埋め込む
          MANIFEST_ORIGIN=$(find $(pwd) -name "AndroidManifest.xml" | grep "/app/src/main/" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_ORIGIN")

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { applicationId namespace; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0-DEBUG" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: metron-debug-apk
          path: app/build/outputs/apk/release/*.apk
