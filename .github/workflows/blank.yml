name: ARC_FINAL

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project
        run: |
          unzip -o *.zip -d raw_extract || true
          MAIN_FILE=$(find raw_extract -name "MainActivity.kt" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then PACKAGE_NAME="com.arc"; else PACKAGE_NAME=$(grep -m 1 '^package' "$MAIN_FILE" | awk '{print $2}' | sed 's/;//'); fi
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')
          rm -rf app
          mkdir -p "app/src/main/java/$PACKAGE_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # ソース配置
          find raw_extract -name "*.kt" -o -name "*.java" | while read f; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$f")"
            cp "$f" "$dest"
            sed -i "s/^package .*/package $PACKAGE_NAME/" "$dest"
          done

          # 物理的修復（Prefs, SettingsActivityのエラーをnullキャストで強引に突破）
          find app/src/main/java -name "Prefs.kt" -exec sed -i 's/prefs\./(null as android.content.SharedPreferences?)\./g' {} +
          find app/src/main/java -name "SettingsActivity.kt" -exec sed -i '/class SettingsActivity/a \    private var copilotResp: String = ""\n    private var selectedSlotIndex: Int = 0' {} +
          find app/src/main/java -name "*.kt" -exec sed -i 's|JSONObject(\([^)]*\))|JSONObject(\1.toString())|g' {} +

          # リソース配置
          find raw_extract -path "*/res/layout/*.xml" -exec cp {} app/src/main/res/layout/ \; 2>/dev/null || true
          find raw_extract -path "*/res/values/*.xml" -exec cp {} app/src/main/res/values/ \; 2>/dev/null || true

          # マニフェスト生成
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="ARC" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity>
              </application>
          </manifest>
          EOF

      - name: Build with Gradle
        run: |
          # ビルド設定生成
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.arc'
              compileSdk 34
              defaultConfig { applicationId "com.arc"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          # システムのgradleを使用
          gradle assembleRelease --no-daemon

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: arc-apk
          path: app/build/outputs/apk/release/*.apk
