name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔥 公式アクションで Gradle 8.7 をセットアップ（ライセンス問題も自動解決）
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    # 🔥 Wrapper がなくても、このアクションなら直接ビルド可能
    - name: Build APK
      run: |
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
