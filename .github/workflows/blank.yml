- name: Final Compilation
        run: |
          # 1. ビルド構成ファイルの生成
          MAIN_FILE=$(find app/src/main/java -name "MainActivity.kt" | head -n 1)
          PACKAGE_NAME=$(grep -m 1 '^package' "$MAIN_FILE" | awk '{print $2}' | sed 's/;//')
          
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { 
                  applicationId "$PACKAGE_NAME"
                  minSdk 24 
                  targetSdk 34 
                  versionCode 1 
                  versionName "1.0-ULTIMATE" 
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
          }
          EOF

          # 2. システムのgradleコマンドを直接叩く（物理的なgradlewの欠如を無視）
          gradle assembleRelease --no-daemon
