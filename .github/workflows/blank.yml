name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Inject Firebase and Build
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # gradlew が存在するディレクトリを物理特定
        GRADLE_ROOT=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
        cd "$GRADLE_ROOT"
        
        # appディレクトリを特定
        APP_DIR=$(find . -name "app" -type d | head -n 1)
        
        # google-services.json を環境変数経由で安全に生成
        echo "$FIREBASE_JSON" > "$APP_DIR/google-services.json"

        # 依存関係の修正（BoMを使用しつつAnalyticsを追加）
        sed -i "/dependencies {/a \    implementation 'com.google.firebase:firebase-analytics-ktx:21.5.1'" "$APP_DIR/build.gradle"
        
        # 権限付与とビルド
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        file: "**/app/build/outputs/apk/debug/app-debug.apk"
