name: Build and Deploy to Firebase (Construction Mode)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7 Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Unzip project
      # 何があろうとZIPを解凍し、中身をログに出して物理確認する
      run: |
        unzip -o *.zip -d extracted_project
        echo "--- Physical File Structure ---"
        find extracted_project -maxdepth 3

    - name: Build and Configure
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # 1. gradlewを全ディレクトリから物理捜索
        GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLE_PATH" ]; then 
          echo "Error: gradlew is missing from the ZIP."
          exit 1
        fi
        
        # 2. その場所を「工場の拠点」にする
        PROJECT_ROOT=$(dirname "$GRADLE_PATH")
        cd "$PROJECT_ROOT"
        chmod +x ./gradlew
        
        # 3. Firebase設定の注入（appフォルダを特定）
        APP_DIR=$(find . -name "app" -type d | head -n 1)
        if [ -n "$APP_DIR" ]; then
          echo "$FIREBASE_JSON" > "${APP_DIR}/google-services.json"
        fi

        # 4. 構築実行（Releaseビルドで解析の魂を生成）
        ./gradlew assembleRelease --no-daemon
        
        # 5. 成果物を固定パスへ救出
        mkdir -p $GITHUB_WORKSPACE/temp_artifacts
        find . -name "app-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/ \;

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        file: temp_artifacts/app-release-unsigned.apk
