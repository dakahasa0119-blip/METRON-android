name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: unzip Proxyhand-Android.zip -d raw_data

    # ① ZIP 内の build.gradle を使って wrapper を生成（ここは Gradle 9.x でOK）
    - name: Generate Wrapper
      run: |
        cd raw_data/Proxyhand-Android
        gradle wrapper --gradle-version 8.7

    # ② 生成された gradlew（8.7）でビルド
    - name: Build APK
      run: |
        cd raw_data/Proxyhand-Android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: raw_data/Proxyhand-Android/app/build/outputs/apk/debug/app-debug.apk
