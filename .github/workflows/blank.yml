name: Build and Deploy to Firebase (Forced Namespace Injector)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7 Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Unzip project
      run: unzip -o *.zip -d .

    - name: Build and Force Construction
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # 1. プロジェクトルートを特定
        ROOT_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        PROJECT_ROOT=$(dirname "$ROOT_FILE")
        cd "$PROJECT_ROOT"
        
        # 2. 物理的欠損の補完（gradlewを生成）
        gradle wrapper
        chmod +x gradlew
        
        # 3. 名前空間エラーの物理粉砕
        # app/build.gradle を探し、android { の直後に namespace を注入する
        APP_GRADLE=$(find . -name "build.gradle" | grep "/app/" | head -n 1)
        if [ -n "$APP_GRADLE" ]; then
          sed -i '/android {/a \    namespace "com.arc.trial"' "$APP_GRADLE"
          echo "Namespace injected into $APP_GRADLE"
        fi

        # 4. Firebase設定の注入
        APP_DIR=$(dirname "$APP_GRADLE")
        echo "$FIREBASE_JSON" > "${APP_DIR}/google-services.json"

        # 5. 構築実行
        ./gradlew assembleRelease --no-daemon
        
        # 6. 成果物を救出
        mkdir -p $GITHUB_WORKSPACE/temp_artifacts
        find . -name "*-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/app-release-unsigned.apk \;

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        file: temp_artifacts/app-release-unsigned.apk
