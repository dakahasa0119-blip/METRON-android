name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 【重要】GitHub公式のアクションで Gradle 8.7 環境を強制構築
    - name: Setup Gradle 8.7 Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    # 【修正】gradlew (jarが無い) を使わず、インストールした直系の gradle コマンドを使用
    - name: Build APK
      run: |
        # ディレクトリ移動（Proxyhand-Android フォルダがある場合）
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        
        # システムにインストールされた Gradle 8.7 で直接ビルド
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
