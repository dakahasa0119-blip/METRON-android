name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Inject Firebase and Build
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # プロジェクトのルート（gradlewがある場所）へ移動
        cd "$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)"
        
        # appフォルダを特定し、確実に google-services.json を生成
        TARGET_APP_DIR=$(find . -maxdepth 2 -name "app" -type d | head -n 1)
        echo "$FIREBASE_JSON" > "${TARGET_APP_DIR}/google-services.json"

        # 依存関係の注入（Analyticsの追加）
        sed -i "/dependencies {/a \    implementation 'com.google.firebase:firebase-analytics-ktx:21.5.1'" "${TARGET_APP_DIR}/build.gradle"
        
        # 権限付与とビルド実行
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        file: "**/app/build/outputs/apk/debug/app-debug.apk"
