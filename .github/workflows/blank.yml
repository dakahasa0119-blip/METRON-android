name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Inject Firebase and Build
      run: |
        # プロジェクトルートの特定
        ROOT_DIR=$(find . -maxdepth 2 -name "app" -type d -exec dirname {} \;)
        cd $ROOT_DIR
        
        # google-services.json の生成
        echo '${{ secrets.FIREBASE_SERVICES_JSON }}' > app/google-services.json

        # 依存関係の修正：バージョンを明示的に指定して解決
        sed -i "/dependencies {/a \    implementation 'com.google.firebase:firebase-analytics-ktx:21.5.1'" app/build.gradle
        
        # ビルド実行
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        # 動的なパス指定で確実にAPKを捕捉
        file: "**/app/build/outputs/apk/debug/app-debug.apk"
