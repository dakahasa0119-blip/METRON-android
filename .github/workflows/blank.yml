name: Build and Deploy to Firebase (Self-Repair Mode)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7 Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Unzip project
      # 艦長の最新ZIPを解凍
      run: unzip -o *.zip -d .

    - name: Build and Force Construction
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # 1. 物理的欠損の補完（gradlewがないなら、その場で作る）
        gradle wrapper
        chmod +x gradlew
        
        # 2. Firebase設定の注入
        APP_DIR=$(find . -name "app" -type d | head -n 1)
        if [ -n "$APP_DIR" ]; then
          echo "$FIREBASE_JSON" > "${APP_DIR}/google-services.json"
        fi

        # 3. 構築実行（Releaseビルドで解析用の魂 Mapping を生成）
        ./gradlew assembleRelease --no-daemon
        
        # 4. 成果物を固定パスへ救出
        mkdir -p $GITHUB_WORKSPACE/temp_artifacts
        find . -name "app-release-unsigned.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/ \;

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        file: temp_artifacts/app-release-unsigned.apk
