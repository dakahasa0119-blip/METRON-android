name: Build Proxyhand-Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔥 キャッシュ機能を無効化（dependency-graphも無効化して障害を回避）
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true
        dependency-graph: disabled

    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    - name: Build APK
      run: |
        if [ -d "Proxyhand-Android" ]; then
          cd Proxyhand-Android
        fi
        # --no-daemon でメモリ消費を抑え、より確実に
        gradle assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
