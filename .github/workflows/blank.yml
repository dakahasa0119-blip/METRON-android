name: ARC_FINAL_STABLE_BUILD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Surgical Extraction & Nucleus Injection
        run: |
          # 1. 解凍
          unzip -o *.zip -d raw_extract || true
          
          # 2. パッケージ名取得
          MAIN_FILE=$(find raw_extract -name "MainActivity.kt" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then
            PACKAGE_NAME="com.arc"
          else
            PACKAGE_NAME=$(grep -m 1 '^package' "$MAIN_FILE" | awk '{print $2}' | sed 's/;//')
          fi
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # 3. ディレクトリ構築
          rm -rf app
          mkdir -p "app/src/main/java/$PACKAGE_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 4. ソースコード配置と物理補正（深部外科手術）
          find raw_extract -name "*.kt" -o -name "*.java" | while read f; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$f")"
            cp "$f" "$dest"
            
            # パッケージ名統一
            sed -i "s/^package .*/package $PACKAGE_NAME/" "$dest"
            
            # Prefs.kt への直接注入 (prefs 変数の受肉)
            if [[ "$f" == *"Prefs.kt"* ]]; then
              sed -i '/class Prefs/a \    private val prefs: android.content.SharedPreferences? = null' "$dest"
              sed -i 's|JSONObject(\([^)]*\))|JSONObject(\1.toString())|g' "$dest"
            fi
            
            # SettingsActivity への直接注入 (不足変数の受肉)
            if [[ "$f" == *"SettingsActivity.kt"* ]]; then
              sed -i '/class SettingsActivity/a \    private var copilotResp: String = ""\n    private var selectedSlotIndex: Int = 0\n    private var profileSlot1: String = ""\n    private var profileSlot2: String = ""\n    private var profileSlot3: String = ""' "$dest"
              # text プロパティへの曖昧な参照を補正
              sed -i 's/\.text =/.setText(/g' "$dest"
              sed -i 's/\.text$/.getText().toString()/g' "$dest"
            fi
          done

          # 5. リソース配置 (AndroidManifestの混入を厳禁)
          find raw_extract -path "*/res/layout/*.xml" | while read x; do
            if [[ "$(basename "$x")" != "AndroidManifest.xml" ]]; then
              cp "$x" "app/src/main/res/layout/"
            fi
          done
          find raw_extract -path "*/res/values/*.xml" -exec cp {} app/src/main/res/values/ \; 2>/dev/null || true

          # 6. マニフェスト生成
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="ARC" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: Build System Finalizer
        run: |
          MAIN_FILE=$(find app/src/main/java -name "MainActivity.kt" | head -n 1)
          PACKAGE_NAME=$(grep -m 1 '^package' "$MAIN_FILE" | awk '{print $2}' | sed 's/;//')
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { 
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              buildFeatures { viewBinding true }
              defaultConfig { 
                  applicationId "$PACKAGE_NAME"
                  minSdk 24 
                  targetSdk 34 
                  versionCode 1 
                  versionName "1.0-STABLE" 
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.nanohttpd:nanohttpd:2.3.1'
          }
          EOF

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          arguments: assembleRelease --no-daemon

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: arc-stable-apk
          path: app/build/outputs/apk/release/*.apk
