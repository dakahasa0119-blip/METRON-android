name: Pure Build to APK (Resource Cleaning Fix)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Surgical Extraction & Resource Filtering
        run: |
          # 1. 物理構造の完全初期化
          unzip -o *.zip -d raw_extract
          
          # 2. パッケージ特定
          MAIN_FILE=$(find raw_extract -name "MainActivity.kt" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package \K[\w.]+' "$MAIN_FILE")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # 3. 構造再定義
          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 4. ソースファイルの物理強制移動
          find raw_extract -name "*.kt" -o -name "*.java" | while read f; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$f")"
            cp "$f" "$dest"
            sed -i "1s/.*/package $PACKAGE_NAME/" "$dest"
            sed -i "/import com.google.firebase/d" "$dest"
            sed -i "/FirebaseApp/d" "$dest"
            sed -i "/import .*\.R;/d" "$dest"
          done

          # 5. 【修正】リソースの厳密抽出（大文字ファイルとManifestを除外）
          find raw_extract -path "*/res/layout/*.xml" -not -name "AndroidManifest.xml" | while read x; do
            # ファイル名を小文字に変換してコピー（Androidの命名規則遵守）
            base=$(basename "$x" | tr '[:upper:]' '[:lower:]')
            cp "$x" "app/src/main/res/layout/$base"
          done
          
          find raw_extract -path "*/res/values/*.xml" -exec cp {} app/src/main/res/values/ \; 2>/dev/null || true

          # 6. マニフェスト再構築
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <application android:label="METRON" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build System Sync
        run: |
          PACKAGE_NAME=$(grep -oP 'package \K[\w.]+' $(find app/src/main/java -name "MainActivity.kt"))
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { applicationId namespace; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0-CLEAN" }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: metron-clean-apk
          path: app/build/outputs/apk/release/*.apk
