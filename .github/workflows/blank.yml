name: DEBUG_ERROR_TRACKER
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      
      - name: Force Project Structure
        run: |
          # 旗を立て、Gradleにプロジェクトとして認識させる
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          gradle wrapper --gradle-version 8.5
          
      - name: Execute Build and Capture Errors
        run: |
          # エラーが出ても中断せず、詳細なスタックトレースを表示する
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info || echo "BUILD_FAILED_SEE_LOGS"
