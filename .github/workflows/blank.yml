name: Pure Build to APK (Debug Mode)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Pre-Configure
        run: |
          unzip -o *.zip -d .
          echo "include ':app'" > settings.gradle
          touch build.gradle

      - name: Surgical Debug Implementation
        run: |
          # 1. パッケージ名特定
          MANIFEST_ORIGIN=$(find $(pwd) -name "AndroidManifest.xml" | grep "/main/" | head -n 1)
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_ORIGIN" || echo "com.arc")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # 2. 構造再構築
          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 3. メインActivityの特定
          REAL_ACTIVITY_FILE=$(find . -maxdepth 10 -name "*.kt" -o -name "*.java" | xargs grep -lE "class .* : .*Activity|class .* extends .*Activity" | head -n 1)
          REAL_ACTIVITY_NAME=$(grep -oP "class \K\w+" "$REAL_ACTIVITY_FILE" | head -n 1 || echo "MainActivity")

          # 4. 【核心】エラーキャッチ回路（Java 17 準拠）
          cat <<EOF > "app/src/main/java/$PACKAGE_PATH/$REAL_ACTIVITY_NAME.kt"
          package $PACKAGE_NAME
          import android.os.Bundle
          import android.widget.TextView
          import android.widget.ScrollView
          import android.graphics.Color
          import androidx.appcompat.app.AppCompatActivity

          class $REAL_ACTIVITY_NAME : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val logView = TextView(this).apply { 
                      textSize = 14f
                      setTextColor(Color.GREEN)
                      setBackgroundColor(Color.BLACK)
                      setPadding(20, 20, 20, 20)
                  }
                  val scrollView = ScrollView(this)
                  scrollView.addView(logView)
                  setContentView(scrollView)

                  Thread.setDefaultUncaughtExceptionHandler { _, throwable ->
                      runOnUiThread {
                          logView.append("\n\n!!! CRASH DETECTED !!!\n")
                          logView.append(throwable.stackTraceToString())
                      }
                  }

                  try {
                      logView.text = "--- METRON DEBUG SYSTEM ACTIVE ---\n"
                      logView.append("Package: $PACKAGE_NAME\n")
                      logView.append("JVM Target: 17\n")
                      logView.append("Status: Awaiting System Logic...\n\n")
                  } catch (e: Exception) {
                      logView.append(e.stackTraceToString())
                  }
              }
          }
          EOF

          # 5. Manifest（警告回避のためpackage属性を削除しnamespaceへ集約）
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="METRON_DEBUG" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".$REAL_ACTIVITY_NAME" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 6. ビルド定義（JVM 17 を強制指定）
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { applicationId '$PACKAGE_NAME'; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0-DEBUG" }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF
          
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build with Gradle
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Archive Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: metron-debug-apk
          path: app/build/outputs/apk/release/*.apk
