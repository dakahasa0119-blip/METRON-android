name: Pure Build to APK (Launcher Direct Link)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: checkout@v4

      - uses: setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Surgical Extraction & Alignment
        run: |
          # 1. 物理構造の初期化
          unzip -o *.zip -d temp_src
          
          # 2. パッケージ名を物理特定（最優先）
          PACKAGE_NAME=$(grep -rP 'package \K[\w.]+' temp_src | head -n 1 | grep -oP '[\w.]+' || echo "com.arc")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 3. オリジナルソースの移植（パッケージ名強制同期）
          find temp_src -name "*.kt" -o -name "*.java" | while read f; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$f")"
            cp "$f" "$dest"
            sed -i "1s/.*/package $PACKAGE_NAME/" "$dest"
            sed -i "/import com.google.firebase/d" "$dest"
            sed -i "/FirebaseApp/d" "$dest"
            sed -i "/import .*\.R;/d" "$dest"
          done

          # 4. リソースの救出
          find temp_src -name "*.xml" -path "*/res/*" | while read x; do
            cp "$x" app/src/main/res/layout/ 2>/dev/null || true
          done

          # 5. 【核心】Launcher Activityを物理特定し、マニフェストへ刻む
          # zip内のActivityクラスを強制的に「起動用」に指定
          REAL_ACTIVITY=$(grep -rE "class .* : .*Activity|class .* extends .*Activity" app/src/main/java | head -n 1 | grep -oP "class \K\w+" || echo "MainActivity")

          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <application android:label="METRON" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:icon="@android:mipmap/sym_def_app_icon">
                  <activity android:name=".$REAL_ACTIVITY" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Finalizer
        run: |
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml)
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { applicationId namespace; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0-LAUNCHER-FIX" }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: metron-launcher-fix
          path: app/build/outputs/apk/release/*.apk
