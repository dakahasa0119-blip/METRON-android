name: Pure Build to APK (Crash Fix)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Unzip
        run: unzip -o *.zip -d .

      - name: Surgical Code Cleaning & Build
        run: |
          # 1. 物理特定
          MANIFEST_ORIGIN=$(find $(pwd) -name "AndroidManifest.xml" | grep "/main/" | head -n 1)
          PROJECT_DIR_ORIGIN=$(echo "$MANIFEST_ORIGIN" | sed 's|/src/main/AndroidManifest.xml||')
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_ORIGIN" || echo "com.arc")
          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # 2. 構造の再構築
          rm -rf app
          mkdir -p app/src/main/java/$PACKAGE_PATH
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 3. 【外科手術】ソースコードの物理洗浄
          find "$PROJECT_DIR_ORIGIN" -name "*.kt" -o -name "*.java" | while read file; do
            dest="app/src/main/java/$PACKAGE_PATH/$(basename "$file")"
            cp "$file" "$dest"
            
            # Firebase関連のインポートとコードを物理的に消去
            sed -i "/import com.google.firebase/d" "$dest"
            sed -i "/FirebaseApp/d" "$dest"
            sed -i "/FirebaseAnalytics/d" "$dest"
            sed -i "/FirebaseMessaging/d" "$dest"
            
            # パッケージ名とRクラスの強制同期
            sed -i "1s/.*/package $PACKAGE_NAME/" "$dest"
            sed -i "2i import ${PACKAGE_NAME}.R;" "$dest"
          done

          # 4. リソース救出
          find "$PROJECT_DIR_ORIGIN" -name "*.xml" -path "*/layout/*" | while read xml; do
            if [[ "$(basename "$xml")" != "AndroidManifest.xml" ]]; then
              cp "$xml" app/src/main/res/layout/
            fi
          done

          # 5. ManifestとGradleの安定版生成
          REAL_ACTIVITY=$(grep -rE "class .* : .*Activity|class .* extends .*Activity" app/src/main/java | head -n 1 | grep -oP "class \K\w+" || echo "MainActivity")
          
          cat <<EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$PACKAGE_NAME">
              <application android:label="METRON" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".$REAL_ACTIVITY" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "include ':app'" > settings.gradle
          
          cat <<EOF > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat <<EOF > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace '$PACKAGE_NAME'
              compileSdk 34
              defaultConfig { applicationId '$PACKAGE_NAME'; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          # 6. 実行
          gradle wrapper
          ./gradlew assembleRelease --no-daemon

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: metron-apk
          path: app/build/outputs/apk/release/*.apk
