name: Build and Deploy to Firebase

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7 Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true

    - name: Unzip project
      run: unzip -o Proxyhand-Android.zip -d .

    - name: Build APK
      env:
        FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICES_JSON }}
      run: |
        # プロジェクトルート特定
        GRADLE_ROOT=$(find . -name "gradlew" -type f -exec dirname {} \; | head -n 1)
        cd "$GRADLE_ROOT"
        
        # Firebase設定の注入
        APP_DIR=$(find . -name "app" -type d | head -n 1)
        echo "$FIREBASE_JSON" > "${APP_DIR}/google-services.json"

        # ビルド実行
        gradle assembleDebug --no-daemon
        
        # 成果物(APK)を確実にルート直下の temp_artifacts にコピーしてパスを固定する
        mkdir -p $GITHUB_WORKSPACE/temp_artifacts
        find . -name "app-debug.apk" -exec cp {} $GITHUB_WORKSPACE/temp_artifacts/ \;

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        token: ${{ secrets.FIREBASE_TOKEN }}
        groups: testers
        # 固定したパスから確実にアップロード
        file: temp_artifacts/app-debug.apk
